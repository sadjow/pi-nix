name: Update Pi

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-pi
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      version: ${{ steps.update.outputs.version }}
      revision: ${{ steps.update.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify upstream archives and update pins
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/update.py
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version sources.json)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- sources.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.update.outputs.changed == 'true'
        with:
          name: pi-sources
          path: sources.json
          if-no-files-found: error
          retention-days: 7

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/check.yml
    with:
      revision: ${{ needs.prepare.outputs.revision }}
      sources-artifact: pi-sources

  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pi-sources
      - name: Publish the tested release
        env:
          PI_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources.json
          git commit -m "chore: update pi to $PI_VERSION"
          git tag "v$PI_VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$PI_VERSION"
